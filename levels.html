<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desk Duel — AI Levels</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.levels-page{min-height:100vh;min-height:100dvh;background:linear-gradient(#f3f7ff,#e8eef9);padding:28px 18px 40px}.levels-wrap{width:min(1050px,100%);margin:auto}.levels-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.levels-title{margin:0;font:clamp(2.6rem,7vw,4.8rem)/.9 var(--font-display);letter-spacing:.02em}.levels-title span{color:var(--blue);text-shadow:3px 3px 0 var(--hi)}.levels-sub{margin:8px 0 0;color:var(--ink-soft)}.collection{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px;box-shadow:0 6px 0 var(--ink);margin-bottom:24px}.collection-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.collection-head h2{margin:0;font:1.6rem var(--font-display)}.pen-strip{display:flex;gap:12px;overflow:auto;padding:14px 2px 5px}.owned-pen{min-width:145px;border:2px solid #ccd5e7;border-radius:14px;padding:8px;background:#f7f9fd;text-align:center}.owned-pen.equipped{border-color:var(--blue);box-shadow:0 0 0 3px #dce6ff}.owned-pen img{display:block;width:120px;height:38px;object-fit:contain;margin:5px auto}.owned-pen b{font-size:.88rem}.owned-pen small{display:block;color:var(--ink-soft);margin:3px 0 7px}.level-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.level-card{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:14px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px;box-shadow:0 5px 0 var(--ink);min-height:128px}.level-card.locked{opacity:.56;filter:saturate(.4)}.level-no{font:2.5rem var(--font-display);text-align:center}.level-pen{width:74px;height:46px;object-fit:contain;transform:rotate(-2deg)}.level-info h3{margin:0;font:1.55rem var(--font-display)}.level-info p{margin:4px 0;color:var(--ink-soft);font-size:.9rem}.level-card .btn{min-width:104px;padding:10px 12px;min-height:44px;font-size:1rem}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--hi);font-size:.7rem;font-weight:800;margin-left:5px}.levels-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.muted{color:var(--ink-soft)}@media(max-width:720px){.level-grid{grid-template-columns:1fr}.levels-head{align-items:flex-start;flex-direction:column}.level-card{grid-template-columns:62px 1fr}.level-card .btn{grid-column:2}.level-pen{width:62px}}
</style>
</head>
<body class="levels-page"><main class="levels-wrap">
<header class="levels-head"><div><h1 class="levels-title">AI <span>LEVELS</span></h1><p class="levels-sub">Beat each kid. Take their pen. Climb from school pens to the final prize.</p></div><a class="btn btn-small" href="index.html">MENU</a></header>
<section class="collection"><div class="collection-head"><h2>Your Pen Collection</h2><span id="progress-text" class="muted"></span></div><div id="collection" class="pen-strip"></div></section>
<section id="levels" class="level-grid"></section>
<div class="levels-actions"><button class="btn btn-small" id="reset" type="button">RESET PROGRESS</button></div>
</main><script src="js/account-scope.js"></script><script type="module" src="js/levels.js"></script></body></html>
