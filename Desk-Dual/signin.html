<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8c5428">
  <link rel="manifest" href="/manifest.json">
  <title>Sign in - Desk Dual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="about-page">
  <main class="about-shell">
    <header class="about-topbar">
      <a class="about-brand" href="index.html">DESK DUAL</a>
      <span class="about-kicker">ATTENDANCE REGISTER</span>
    </header>
    <section class="about-board" aria-labelledby="signin-title">
      <h1 class="about-chalk-title" id="signin-title">Sign in</h1>
      <p class="about-lead">Sign in with Google to enter Desk Dual. Your name, pens and progress are saved and follow you to any device.</p>
      <div class="about-section-grid signin-grid">
        <article class="about-card signin-card">
          <h2>🔔 Mark your attendance</h2>
          <p>No password needed. Sign in once to enter the classroom; your progress is saved to your account.</p>
          <button class="btn btn-primary" type="button" id="google-signin">SIGN IN WITH GOOGLE</button>
          <p id="signin-status" role="status" aria-live="polite" style="min-height:1.4em"></p>
        </article>
      </div>
      <footer class="about-footer">
        <a class="btn about-back" href="index.html">← BACK TO HOME</a>
      </footer>
    </section>
  </main>
  <script type="module" src="js/signin.js"></script>
</body>
</html>
