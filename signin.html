<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6e3e1e">
  <meta name="description" content="Sign in to Desk Duel with your Google account.">
  <title>Sign In — Desk Duel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="signin-page">
  <main class="signin-card">
    <div class="signin-pencil" aria-hidden="true">✏️</div>
    <h1>PLAYER ACCOUNT</h1>
    <p>Sign in to Desk Duel with Google and get back to the classroom.</p>
    <button id="google-signin" class="google-signin-btn" type="button"><span class="google-g" aria-hidden="true">G</span> CONTINUE WITH GOOGLE</button>
    <p id="signin-status" class="signin-status" role="status" aria-live="polite"></p>
    <a class="signin-back" href="index.html">← Back to the classroom</a>
    <p class="signin-footnote">Your Google sign-in is handled securely by Firebase Authentication.</p>
  </main>
  <script type="module" src="js/signin.js"></script>
</body>
</html>
