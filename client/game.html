<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17224a">
  <title>Desk Duel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
</head>
<body class="game-page">
  <div class="game">
    <header class="hud" aria-label="Scoreboard">
      <div class="hud-player hud-p1"><span class="hud-name" id="name1">PLAYER 1</span><span class="hud-score" id="score1">0</span></div>
      <div class="hud-round"><span class="hud-round-label">ROUND</span><span class="hud-round-num" id="round">1</span></div>
      <div class="hud-player hud-p2"><span class="hud-score" id="score2">0</span><span class="hud-name" id="name2">PLAYER 2</span></div>
    </header>

    <main class="stage" id="stage">
      <canvas id="desk" aria-label="Desk with two pens. Press your pen, drag backwards and release to flick it." role="img"></canvas>
    </main>

    <footer class="controls">
      <div class="turn" id="turn" data-side="p1">PLAYER 1 TURN</div>
      <div class="power" id="power" role="meter" aria-label="Shot power" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="power-fill"></div></div>
      <p class="hint" id="hint" aria-live="off">Press the pen, drag backwards, then release.</p>
      <div class="actions">
        <button class="btn btn-small" type="button" id="btn-restart">RESTART</button>
        <a class="btn btn-small" href="index.html">MENU</a>
      </div>
    </footer>
  </div>
  <div class="banner" id="banner" aria-live="polite"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title" hidden>
    <div class="card">
      <p class="ov-kicker" id="ov-kicker"></p>
      <h2 id="ov-title"></h2>
      <p class="ov-score-label" id="ov-score-label">Score</p>
      <p class="ov-score" id="ov-score"></p>
      <ul class="ov-stats" id="ov-stats"></ul>
      <div class="ov-actions" id="ov-actions"></div>
    </div>
  </div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
