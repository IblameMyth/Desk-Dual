<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#6e3e1e"><meta name="description" content="Desk Dual — choose a classroom game and play.">
<title>Desk Dual — Classroom Games</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body class="menu-page deskdual-home"><main class="home-shell">
<header class="home-header"><div class="classroom-label">STD 9-A&nbsp; • &nbsp;THE CLASSROOM GAME ZONE</div><p class="home-eyebrow">THE BELL HAS RUNG!</p><h1 class="home-title"><span>DESK</span> <b>DUAL</b></h1><p class="home-subtitle">Pick a game. Challenge your benchmate. Let the fun begin!</p></header>
<section class="game-grid" aria-label="Choose a game">
<a class="game-card playable" href="penfight.html" aria-label="Open Pen Fight menu"><div class="game-card-top"><span class="game-icon">🖊️</span><span class="game-status available">PLAY NOW</span></div><h2>Pen Fight</h2><p>Flick your pen. Knock theirs off the desk.</p><span class="card-action">PLAY GAME <span aria-hidden="true">→</span></span></a>
<button class="game-card coming" type="button" data-soon="Raja Rani Chor Sipahi"><div class="game-card-top"><span class="game-icon">👑</span><span class="game-status">COMING SOON</span></div><h2>Raja Rani Chor Sipahi</h2><p>Guess the roles and claim the crown.</p><span class="card-action">COMING SOON</span></button>
<button class="game-card coming" type="button" data-soon="Hand Cricket"><div class="game-card-top"><span class="game-icon">🏏</span><span class="game-status">COMING SOON</span></div><h2>Hand Cricket</h2><p>Odd or even? Make every run count.</p><span class="card-action">COMING SOON</span></button>
<button class="game-card coming" type="button" data-soon="Kaun Hai Chor"><div class="game-card-top"><span class="game-icon">🕵️</span><span class="game-status">COMING SOON</span></div><h2>Kaun Hai Chor</h2><p>Read the clues. Find the classroom thief.</p><span class="card-action">COMING SOON</span></button>
<button class="game-card coming" type="button" data-soon="Paper Football"><div class="game-card-top"><span class="game-icon">⚽</span><span class="game-status">COMING SOON</span></div><h2>Paper Football</h2><p>Fold, flick, and score a desk-side goal.</p><span class="card-action">COMING SOON</span></button>
<button class="game-card coming" type="button" data-soon="Thumb Fight"><div class="game-card-top"><span class="game-icon">👍</span><span class="game-status">COMING SOON</span></div><h2>Thumb Fight</h2><p>Lock thumbs and battle for the win.</p><span class="card-action">COMING SOON</span></button>
<button class="game-card coming" type="button" data-soon="Chop Stick"><div class="game-card-top"><span class="game-icon">🥢</span><span class="game-status">COMING SOON</span></div><h2>Chop Stick</h2><p>Count, split, and outsmart your opponent.</p><span class="card-action">COMING SOON</span></button>
<button class="game-card coming" type="button" data-soon="Tippy Tippy Top Tap"><div class="game-card-top"><span class="game-icon">🎨</span><span class="game-status">COMING SOON</span></div><h2>Tippy Tippy Top Tap</h2><p>A classic colour-spotting classroom game.</p><span class="card-action">COMING SOON</span></button>
</section>
<footer class="home-footer"><span>✎ &nbsp; MADE FOR THE BACKBENCHERS</span><div><button class="footer-link" type="button" id="btn-settings">SETTINGS</button><a class="footer-link" href="about.html">ABOUT</a></div></footer>
</main>

<dialog id="settings-dialog" aria-labelledby="settings-title"><h2 id="settings-title">Settings</h2>
<div class="setting"><span class="setting-label" id="lbl-sound">Sound</span><div class="seg" role="group" aria-labelledby="lbl-sound" data-setting="sound"><button type="button" data-value="true">ON</button><button type="button" data-value="false">OFF</button></div></div>
<div class="setting"><span class="setting-label" id="lbl-vib">Vibration</span><div class="seg" role="group" aria-labelledby="lbl-vib" data-setting="vibration"><button type="button" data-value="true">ON</button><button type="button" data-value="false">OFF</button></div></div>
<div class="setting"><span class="setting-label" id="lbl-gfx">Graphics</span><div class="seg" role="group" aria-labelledby="lbl-gfx" data-setting="graphics"><button type="button" data-value="low">LOW</button><button type="button" data-value="high">HIGH</button></div></div>
<div class="setting"><span class="setting-label" id="lbl-guide">Aim guide</span><div class="seg" role="group" aria-labelledby="lbl-guide" data-setting="guide"><button type="button" data-value="true">ON</button><button type="button" data-value="false">OFF</button></div></div>
<div class="setting"><span class="setting-label" id="lbl-theme">Theme</span><div class="seg" role="group" aria-labelledby="lbl-theme" data-setting="theme"><button type="button" data-value="light">LIGHT</button><button type="button" data-value="dark">DARK</button></div></div><button class="btn btn-primary btn-small settings-done" type="button" data-close>DONE</button></dialog>

<script type="module" src="js/main.js"></script></body></html>
